<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#192a56"/>
      <stop offset="100%" stop-color="#0a1020"/>
    </radialGradient>
    <linearGradient id="bolt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff275"/>
      <stop offset="50%" stop-color="#feca57"/>
      <stop offset="100%" stop-color="#ff9f43"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Background circle -->
  <circle cx="32" cy="32" r="30" fill="url(#bg)" stroke="#54a0ff" stroke-width="2.5"/>
  <circle cx="32" cy="32" r="27" fill="none" stroke="#2e86de" stroke-width="0.75" stroke-dasharray="3 2"/>
  <!-- Lightning Bolt -->
  <path d="M 36 10 L 19 33 L 30 33 L 25 54 L 46 27 L 34 27 Z" 
        fill="url(#bolt)" 
        stroke="#ffffff" 
        stroke-width="1.2" 
        stroke-linejoin="round"
        filter="url(#glow)"/>
</svg>